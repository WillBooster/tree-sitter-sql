[package]
authors = ["WillBooster Inc."]
autoexamples = false
categories = ["parser-implementations", "parsing", "text-editors"]
description = "SQL grammars (SQLite, PostgreSQL, MySQL, and Oracle) for tree-sitter"
edition = "2024"
keywords = ["tree-sitter", "sql", "sqlite", "postgresql", "mysql"]
license = "MIT"
name = "willbooster-tree-sitter-sql"
readme = "README.md"
repository = "https://github.com/WillBooster/tree-sitter-sql"
version = "0.0.0"

build = "bindings/rust/build.rs"
include = [
  "/bindings/rust/*",
  "/common/*",
  "/mysql/grammar.js",
  "/mysql/src/*",
  "!/mysql/src/grammar.json",
  "!/mysql/src/.gitattributes",
  "!/mysql/src/.editorconfig",
  "/oracle/grammar.js",
  "/oracle/src/*",
  "!/oracle/src/grammar.json",
  "!/oracle/src/.gitattributes",
  "!/oracle/src/.editorconfig",
  "/postgresql/grammar.js",
  "/postgresql/src/*",
  "!/postgresql/src/grammar.json",
  "!/postgresql/src/.gitattributes",
  "!/postgresql/src/.editorconfig",
  "/sqlite/grammar.js",
  "/sqlite/src/*",
  "!/sqlite/src/grammar.json",
  "!/sqlite/src/.gitattributes",
  "!/sqlite/src/.editorconfig",
  "/tree-sitter.json",
  "/LICENSE",
]

[lib]
name = "tree_sitter_sql"
path = "bindings/rust/lib.rs"

[features]
default = ["mysql", "oracle", "postgresql", "sqlite"]
mysql = []
oracle = []
postgresql = []
sqlite = []

[dependencies]
tree-sitter-language = "0.1.6"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = { package = "willbooster-tree-sitter", version = "23.0.2" }
