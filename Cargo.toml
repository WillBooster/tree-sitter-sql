[package]
authors = ["WillBooster Inc."]
autoexamples = false
categories = ["parser-implementations", "parsing", "text-editors"]
description = "SQL grammars (SQLite) for tree-sitter"
edition = "2024"
keywords = ["parsing", "tree-sitter", "sql", "sqlite"]
license = "MIT"
name = "willbooster-tree-sitter-sql"
readme = "README.md"
repository = "https://github.com/WillBooster/tree-sitter-sql"
version = "0.0.0"

build = "bindings/rust/build.rs"
include = [
  "/bindings/rust/*",
  "/common/*",
  "/sqlite/grammar.js",
  "/sqlite/src/*",
  "!/sqlite/src/.gitattributes",
  "!/sqlite/src/.editorconfig",
  "/tree-sitter.json",
  "/LICENSE",
]

[lib]
name = "tree_sitter_sql"
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1.6"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = { package = "willbooster-tree-sitter", version = "20.0.0" }
